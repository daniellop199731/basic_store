spring.application.name=msvc-products
#Asignacion de puerto manual y fija
#server.port=8081

#Asignacion de puerto automativa y dinamica
server.port=${PORT:0}
eureka.instance.instance-id=${spring.cloud.client.hostname}:${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:mysql://localhost:3306/basic_store_DB?createDatabaseIfNotExist=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sasa
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#spring.data.mongodb.uri=mongodb://localhost:27017/esquema_bancolombia

#Por defecto JPA traduce el CamelCase a nombres separados por guion bajo
#Para evadir eso, se ponen las siguientes dos lineas
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

eureka.client.service-url.defaultZone=http://localhost:8761/eureka